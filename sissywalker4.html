<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sissy Walker PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" id="manifestPlaceholder">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(180deg, #000, #1a1a1a);
    color: white;
    text-align: center;
}

.container {
    padding: 15px;
    max-width: 420px;
    margin: auto;
}

input, button {
    width: 90%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

button {
    background: #ff4da6;
    color: white;
    font-weight: bold;
}

#timer {
    font-size: 42px;
    margin: 10px;
}

#status {
    padding: 8px;
    border-radius: 20px;
}

.good { background: #2ecc71; }
.warning { background: #e74c3c; }
.processing { background: #f39c12; }

#score {
    font-size: 18px;
    margin-top: 5px;
}

video {
    width: 100%;
    border-radius: 12px;
    margin-top: 10px;
}
</style>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

</head>
<body>

<div class="container">

<h2>SissyWalker PRO</h2>

<input type="number" id="duration" value="2" placeholder="Duration (minutes)">
<input type="text" id="customText" placeholder="Mistress message">

<button onclick="start()">Start</button>

<div id="timer">00:00</div>
<div id="status">Idle</div>
<div id="score">Score: 0</div>

<video id="video" autoplay muted playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<audio id="beep">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

</div>

<script>
let stream, recorder, chunks=[];
let remainingTime = 0;
let timerInterval;
let lastMovementTime = Date.now();

let walkingScore = 50;
let lastKneeY = null;

// ---------------- START ----------------
async function start(){
    const min = document.getElementById("duration").value;
    remainingTime = min * 60;

    stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
    });

    const video = document.getElementById("video");
    video.srcObject = stream;
    await video.play();

    initPose(video);
    startRecording();
    startTimer();
}

// ---------------- POSE ----------------
let pose;

function initPose(video){
    pose = new Pose({
        locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
        modelComplexity: 0,
        smoothLandmarks: true
    });

    pose.onResults(onPoseResults);

    const camera = new Camera(video, {
        onFrame: async () => {
            await pose.send({ image: video });
        },
        width: 640,
        height: 480
    });

    camera.start();
}

function onPoseResults(results){
    if (!results.poseLandmarks) return;

    const leftKnee = results.poseLandmarks[25];
    const rightKnee = results.poseLandmarks[26];

    if(!leftKnee || !rightKnee) return;

    const avgY = (leftKnee.y + rightKnee.y)/2;

    if(lastKneeY !== null){
        const diff = Math.abs(avgY - lastKneeY);

        if(diff > 0.015){
            lastMovementTime = Date.now();
            walkingScore += 0.3;
        } else {
            walkingScore -= 0.5;
        }
    }

    lastKneeY = avgY;

    walkingScore = Math.max(0, Math.min(100, walkingScore));
    document.getElementById("score").innerText =
        "Obedience Score: " + Math.round(walkingScore);
}

// ---------------- TIMER ----------------
function startTimer(){
    timerInterval = setInterval(()=>{
        const now = Date.now();

        if(now - lastMovementTime < 1500){
            remainingTime--;
            setStatus("✔ Walking","good");
        } else {
            setStatus("⚠ WALK!","warning");
            document.getElementById("beep").play();
        }

        const m = Math.floor(remainingTime/60);
        const s = remainingTime%60;

        document.getElementById("timer").innerText =
            `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

        if(remainingTime <= 0){
            stopAll();
        }

    },1000);
}

function setStatus(t,c){
    const el = document.getElementById("status");
    el.innerText = t;
    el.className = c;
}

// ---------------- RECORD ----------------
function startRecording(){
    chunks=[];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.start();
}

// ---------------- STOP ----------------
function stopAll(){
    clearInterval(timerInterval);
    setStatus("Processing...","processing");

    recorder.stop();

    recorder.onstop = ()=>{
        processVideo(new Blob(chunks,{type:'video/webm'}));
    };
}

// ---------------- VIDEO PROCESS ----------------
function processVideo(blob){
    const customText = document.getElementById("customText").value || "SissyWalker";

    const video = document.createElement("video");
    video.src = URL.createObjectURL(blob);

    video.onloadeddata = ()=>{
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const stream = canvas.captureStream(30);
        const rec = new MediaRecorder(stream);

        let newChunks=[];
        rec.ondataavailable = e=>newChunks.push(e.data);
        rec.start();

        video.playbackRate = 10;
        video.play();

        const now = new Date();
        const dateStr = now.toISOString().replace(/[-:T]/g,"").slice(0,12);
        const durationMin = document.getElementById("duration").value;

        function draw(){
            ctx.drawImage(video,0,0);

            // CENTER TEXT
            ctx.fillStyle="rgba(255,255,255,0.25)";
            ctx.font="bold 28px Arial";
            ctx.textAlign="center";

            ctx.fillText(customText, canvas.width/2, canvas.height/2);

            // bottom watermark
            ctx.fillStyle="red";
            ctx.font="16px Arial";
            ctx.textAlign="left";

            ctx.fillText(
                `SissyWalker ${dateStr} | ${durationMin} min`,
                10,
                canvas.height-20
            );

            if(!video.ended){
                requestAnimationFrame(draw);
            }
        }

        draw();

        video.onended = ()=>{
            rec.stop();

            rec.onstop = ()=>{
                const finalBlob = new Blob(newChunks,{type:'video/webm'});

                const a = document.createElement("a");
                a.href = URL.createObjectURL(finalBlob);
                a.download = `SissyWalker_${dateStr}.webm`;
                a.click();

                setStatus("Saved ✔","good");
            };
        };
    };
}

// ---------------- PWA ----------------

// Manifest inline
const manifest = {
  name: "Sissy Walker PRO",
  short_name: "Walker",
  display: "standalone",
  background_color: "#000",
  theme_color: "#ff4da6",
  icons: []
};

const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
document.getElementById('manifestPlaceholder').href = URL.createObjectURL(blob);

// Service Worker inline
if ('serviceWorker' in navigator) {
    const swBlob = new Blob([`
        self.addEventListener('install', e => self.skipWaiting());
    `], {type:'text/javascript'});

    navigator.serviceWorker.register(URL.createObjectURL(swBlob));
}
</script>

</body>
</html>
