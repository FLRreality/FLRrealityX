<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sissy Walker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #111, #1c1c1c);
    color: white;
    text-align: center;
    padding: 10px;
}

.container {
    max-width: 420px;
    margin: auto;
}

h2 {
    margin-bottom: 5px;
}

input, button {
    width: 90%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

button {
    background: #ff4da6;
    color: white;
    font-weight: bold;
}

#timer {
    font-size: 42px;
    margin: 10px 0;
}

#status {
    font-size: 18px;
    padding: 6px 12px;
    border-radius: 20px;
    display: inline-block;
}

.good { background: #2ecc71; }
.warning { background: #e74c3c; }
.processing { background: #f39c12; }

video {
    width: 100%;
    border-radius: 12px;
    margin-top: 10px;
}
</style>
</head>
<body>

<div class="container">

<h2>SissyWalker</h2>

<input type="number" id="duration" value="2" placeholder="Duration (minutes)">
<input type="text" id="customText" placeholder="Mistress message (watermark)">

<button onclick="start()">Start Walking</button>

<div id="timer">00:00</div>
<div id="status">Idle</div>

<video id="video" autoplay muted playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<audio id="beep">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

</div>

<script>
let stream, recorder, chunks=[];
let detecting = false;
let lastFrame = null;

let remainingTime = 0;
let timerInterval;
let lastMovementTime = Date.now();

async function start(){
    const min = document.getElementById("duration").value;
    remainingTime = min * 60;

    stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
    });

    const video = document.getElementById("video");
    video.srcObject = stream;
    await video.play();

    startRecording();
    startDetection();
    startTimer();
}

function startRecording(){
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.start();
}

function startTimer(){
    timerInterval = setInterval(()=>{
        const now = Date.now();

        if(now - lastMovementTime < 1500){
            remainingTime--;
        }

        const min = Math.floor(remainingTime / 60);
        const sec = remainingTime % 60;

        document.getElementById("timer").innerText =
            `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

        if(now - lastMovementTime > 1500){
            setStatus("⚠ WALK!", "warning");
            document.getElementById("beep").play();
        } else {
            setStatus("✔ Walking", "good");
        }

        if(remainingTime <= 0){
            stopAll();
        }

    },1000);
}

function setStatus(text, cls){
    const el = document.getElementById("status");
    el.innerText = text;
    el.className = cls;
}

function startDetection(){
    detecting = true;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function detect(){
        if(!detecting) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const h = canvas.height;

        ctx.drawImage(video, 0, h/2, canvas.width, h/2, 0, 0, canvas.width, h/2);
        const frame = ctx.getImageData(0,0,canvas.width, h/2);

        if(lastFrame){
            let diff = 0;
            for(let i=0;i<frame.data.length;i+=4){
                diff += Math.abs(frame.data[i] - lastFrame.data[i]);
            }
            if(diff > 1500000){
                lastMovementTime = Date.now();
            }
        }

        lastFrame = frame;
        requestAnimationFrame(detect);
    }

    detect();
}

function stopAll(){
    detecting = false;
    clearInterval(timerInterval);

    setStatus("Processing...", "processing");

    recorder.stop();

    recorder.onstop = ()=>{
        const blob = new Blob(chunks, {type:'video/webm'});
        processVideo(blob);
    };
}

function processVideo(blob){
    const customText = document.getElementById("customText").value || "SissyWalker";

    const video = document.createElement("video");
    video.src = URL.createObjectURL(blob);

    video.onloadeddata = ()=>{

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const stream = canvas.captureStream(30);
        const rec = new MediaRecorder(stream);

        let newChunks=[];
        rec.ondataavailable = e=>newChunks.push(e.data);
        rec.start();

        video.playbackRate = 10;
        video.play();

        const now = new Date();
        const dateStr = now.toISOString().replace(/[-:T]/g,"").slice(0,12);
        const durationMin = document.getElementById("duration").value;

        function draw(){
            ctx.drawImage(video,0,0);

            // CENTER WATERMARK (main feature)
            ctx.fillStyle="rgba(255,255,255,0.25)";
            ctx.font="bold 28px Arial";
            ctx.textAlign="center";

            ctx.fillText(
                customText,
                canvas.width / 2,
                canvas.height / 2
            );

            // bottom info watermark
            ctx.font="16px Arial";
            ctx.fillStyle="red";
            ctx.textAlign="left";

            ctx.fillText(
                `SissyWalker ${dateStr} | ${durationMin} min`,
                10,
                canvas.height - 20
            );

            if(!video.ended){
                requestAnimationFrame(draw);
            }
        }

        draw();

        video.onended = ()=>{
            rec.stop();

            rec.onstop = ()=>{
                const finalBlob = new Blob(newChunks, {type:'video/webm'});

                const a = document.createElement("a");
                a.href = URL.createObjectURL(finalBlob);
                a.download = `SissyWalker_${dateStr}.webm`;
                a.click();

                setStatus("Saved ✔", "good");
            };
        };
    };
}
</script>

</body>
</html>
